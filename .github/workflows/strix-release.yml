name: Strix Halo release build

# Builds this branch (with the quantized-KV FA fixes) for gfx1151 and publishes the binaries as a
# GitHub Release. Matches the Lychee-Technology / lemonade "builds repo" model, except it compiles the
# PATCHED tree rather than stock upstream.
#
# NOTE: GitHub-hosted runners have no AMD GPU, so this job can only BUILD and PACKAGE — it cannot run the
# binaries or validate them on gfx1151. On-device correctness (test-backend-ops 6000/6000, byte-identical
# generation) was verified separately; see docs/fa-quant-kv-gqa/STRIX-HALO.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. strix-v1)"
        required: true
        type: string
  push:
    tags:
      - "strix-v*"

permissions:
  contents: write   # required for the release job to create/upload a Release

jobs:
  build-rocm:
    name: ROCm / HIP (gfx1151)
    runs-on: ubuntu-24.04
    container:
      image: rocm/dev-ubuntu-24.04:7.2.4-complete
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build git ca-certificates
      - name: Configure + build (gfx1151)
        run: |
          export PATH=/opt/rocm/bin:$PATH
          cmake -S . -B build-hip -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_HIP=ON \
            -DAMDGPU_TARGETS=gfx1151 \
            -DCMAKE_C_COMPILER=/opt/rocm/llvm/bin/clang \
            -DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++ \
            -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_TESTS=OFF
          cmake --build build-hip -j "$(nproc)"
      - name: Package
        run: |
          mkdir -p dist
          tar -C build-hip/bin -czf dist/llama-strix-halo-gfx1151-rocm.tar.gz .
          ( cd dist && sha256sum *.tar.gz > SHA256SUMS-rocm.txt )
      - uses: actions/upload-artifact@v4
        with:
          name: rocm
          path: dist/*

  build-vulkan:
    name: Vulkan / RADV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan SDK (LunarG) + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build wget ca-certificates
          # Distro glslc/SPIRV-Headers are often too old for current shaders; use the LunarG SDK.
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
      - name: Configure + build
        run: |
          source /etc/profile.d/vulkan-sdk.sh 2>/dev/null || true
          cmake -S . -B build-vulkan -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_TESTS=OFF
          cmake --build build-vulkan -j "$(nproc)"
      - name: Package
        run: |
          mkdir -p dist
          tar -C build-vulkan/bin -czf dist/llama-strix-halo-vulkan.tar.gz .
          ( cd dist && sha256sum *.tar.gz > SHA256SUMS-vulkan.txt )
      - uses: actions/upload-artifact@v4
        with:
          name: vulkan
          path: dist/*

  release:
    name: Publish release
    needs: [ build-rocm, build-vulkan ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist
      - name: Create / update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Strix Halo llama.cpp (gfx1151) — $TAG" \
            --notes "$(cat <<'EOF'
          Quantized-KV flash-attention fixes for gfx1151, both backends. See
          docs/fa-quant-kv-gqa/STRIX-HALO.md for what changed and the measured gains.

          Artifacts
          - llama-strix-halo-gfx1151-rocm.tar.gz — HIP build, AMDGPU target gfx1151. Requires a ROCm 7.2.x
            runtime installed (the binaries link libamdhip64 / librocblas / libhipblas).
          - llama-strix-halo-vulkan.tar.gz — Vulkan build, runs on RADV (Mesa) with no ROCm dependency.
          - SHA256SUMS-*.txt — checksums.

          Built in CI on GitHub-hosted runners (no AMD GPU), so these are compile-and-package only; on-device
          correctness was verified separately (test-backend-ops 6000/6000, byte-identical generation).
          EOF
          )"
